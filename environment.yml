# DNA-Diff - conda environment
#
# Reproduces the environment this project was developed and trained in
# (Linux x86_64, NVIDIA GPU, CUDA 12.1 runtime shipped with the torch wheels).
#
#   conda env create -f environment.yml
#   conda activate dna-diff
#
# The CUDA runtime comes from the PyTorch cu121 wheels, so only an NVIDIA
# driver supporting CUDA 12.1+ is required on the host - no system CUDA
# toolkit install is needed. Driver >= 530 is recommended.
#
# After creating the environment, install the vendored OSNet ReID backbone
# (see README.md, "Installation" step 3):
#   cd Data_Generation/deep_person_reid && pip install -e . --no-build-isolation
name: dna-diff

channels:
  - conda-forge
  - defaults

dependencies:
  - python=3.10
  - pip
  # Build toolchain for the Cython extension in deep_person_reid (torchreid).
  - gxx_linux-64=11
  - libstdcxx-ng

  - pip:
      # ---- PyTorch (CUDA 12.1 build) -------------------------------------
      - --extra-index-url https://download.pytorch.org/whl/cu121
      - torch==2.1.2+cu121
      - torchvision==0.16.2+cu121
      - triton==2.1.0
      - xformers==0.0.23.post1

      # ---- Diffusion / HuggingFace stack ---------------------------------
      # diffusers is pinned to 0.23.1: the training scripts subclass the
      # LoRA attention processors from this release, newer versions moved them.
      - diffusers==0.23.1
      - transformers==4.41.2
      - tokenizers==0.19.1
      - accelerate==0.31.0
      - huggingface-hub==0.23.4
      - safetensors==0.4.3
      - datasets==2.20.0
      - bitsandbytes==0.43.1
      - sentencepiece==0.2.0
      - ftfy==6.3.1
      - regex==2024.5.15

      # ---- Numerics / imaging --------------------------------------------
      - numpy==1.26.3
      - scipy==1.14.0
      - pandas==2.2.2
      - pillow==10.2.0
      # 4.11.0.86 is the newest opencv-python whose metadata still allows
      # numpy 1.x; 4.12+ declares numpy>=2, which cannot be satisfied
      # alongside torch 2.1.2 (not numpy-2 compatible).
      - opencv-python==4.11.0.86
      - imageio==2.37.3
      - kornia==0.8.2
      - kornia-rs==0.1.10
      - einops==0.8.0
      - matplotlib==3.8.2

      # ---- deep-person-reid (OSNet) dependencies --------------------------
      - Cython==3.2.4
      - h5py==3.16.0
      - yacs==0.1.8
      - gdown==6.0.0
      - chardet==7.4.3
      - future==1.0.0
      - six==1.17.0

      # ---- Logging / misc --------------------------------------------------
      # setuptools is pinned: deep_person_reid's setup.py uses the legacy
      # distutils Extension API, which newer setuptools releases drop.
      - setuptools==70.2.0
      - tensorboard==2.15.1
      - wandb==0.17.2
      - tqdm==4.66.4
      - packaging==23.2
      - protobuf==4.23.4
      - PyYAML==6.0.1
      - psutil==5.9.7

      # ---- Transitive pins -------------------------------------------------
      # Not imported directly, but pinned so a future release of one of them
      # cannot silently break the stack above (notably pyarrow/fsspec, which
      # datasets 2.20 is sensitive to).
      - pyarrow==16.1.0
      - pyarrow-hotfix==0.6
      - fsspec==2023.12.2
      - dill==0.3.8
      - multiprocess==0.70.16
      - aiohttp==3.9.5
      - filelock==3.13.1
      - Jinja2==3.1.2
      - networkx==3.2.1
      - sympy==1.12
      - typing_extensions==4.9.0
      - wcwidth==0.2.13
      - absl-py==2.0.0
